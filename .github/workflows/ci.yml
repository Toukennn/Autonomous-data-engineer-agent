name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # ==========================================================
  # PYTHON QUALITY GATE
  # ==========================================================

  quality:
    name: Tests, Lint, Build

    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      # Dummy values only.
      #
      # Deterministic tests replace LLM clients before
      # external requests occur.
      #
      # Never put real API credentials here.
      ANTHROPIC_API_KEY: sk-ant-test
      OPENAI_API_KEY: sk-test

      ETL_MAX_TOOL_CALLS: "8"

    steps:

      # --------------------------------------------------------
      # SOURCE
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # --------------------------------------------------------
      # PYTHON / UV
      # --------------------------------------------------------

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          version: latest-known

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --python 3.12


      # --------------------------------------------------------
      # QUALITY CHECKS
      # --------------------------------------------------------

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -v


      # --------------------------------------------------------
      # PACKAGE BUILD
      # --------------------------------------------------------

      - name: Build package
        run: uv build


  # ==========================================================
  # POSTGRESQL / DBT INTEGRATION GATE
  # ==========================================================

  database-integration:
    name: PostgreSQL Integration

    runs-on: ubuntu-latest

    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: agent_test

      DBT_TARGET_SCHEMA: dbt_test
      DBT_THREADS: "1"

      DATA_ROOT: /tmp/autonomous-data-engineer-agent-ci
      SQL_STATEMENT_TIMEOUT_MS: "10000"
      SQL_MAX_ROWS: "1000"

      RUN_DATABASE_INTEGRATION: "1"

      # Dummy values only. Integration tests do not call LLM APIs.
      OPENAI_API_KEY: sk-test
      ANTHROPIC_API_KEY: sk-ant-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          version: latest-known

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --python 3.12

      - name: Verify PostgreSQL connectivity
        run: >-
          uv run pytest
          tests/integration/test_postgres_warehouse.py::test_database_settings_connect_to_postgres
          -v

      - name: Run warehouse and dbt integration tests
        run: >-
          uv run pytest
          tests/integration/test_postgres_warehouse.py::test_dbt_build_is_visible_in_governed_catalog
          tests/integration/test_postgres_warehouse.py::test_database_util_queries_bounded_gold_results
          -v


  # ==========================================================
  # DOCKER IMAGE GATE
  # ==========================================================

  container:
    name: Docker Build and Smoke Test

    needs:
      - quality
      - database-integration

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      # --------------------------------------------------------
      # SOURCE
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # --------------------------------------------------------
      # BUILD PRODUCTION IMAGE
      # --------------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            --tag autonomous-data-engineer-agent:ci \
            .


      # --------------------------------------------------------
      # BOOT THE IMAGE
      # --------------------------------------------------------
      #
      # No database or LLM credentials are intentionally
      # supplied.
      #
      # /health must work independently because agent loading
      # is lazy.
      # --------------------------------------------------------

      - name: Start container
        run: |
          docker run \
            --detach \
            --name autonomous-data-engineer-agent-ci \
            --publish 8000:8000 \
            autonomous-data-engineer-agent:ci


      # --------------------------------------------------------
      # WAIT FOR DOCKER HEALTH
      # --------------------------------------------------------

      - name: Wait for healthy container
        run: |
          for attempt in {1..30}; do

            status="$(
              docker inspect \
                --format='{{.State.Health.Status}}' \
                autonomous-data-engineer-agent-ci \
                2>/dev/null \
                || true
            )"

            echo "Container health: ${status:-unknown}"

            if [ "$status" = "healthy" ]; then
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              echo "Container became unhealthy."
              docker logs autonomous-data-engineer-agent-ci || true
              exit 1
            fi

            sleep 2

          done

          echo "Container did not become healthy in time."
          docker logs autonomous-data-engineer-agent-ci || true
          exit 1


      # --------------------------------------------------------
      # HTTP BOUNDARY
      # --------------------------------------------------------

      - name: Verify health endpoint
        run: |
          response="$(
            curl \
              --fail \
              --silent \
              http://127.0.0.1:8000/health
          )"

          echo "$response"

          echo "$response" \
            | grep -q '"status":"ok"'


      # --------------------------------------------------------
      # SECURITY: NON-ROOT
      # --------------------------------------------------------

      - name: Verify non-root runtime
        run: |
          runtime_uid="$(
            docker exec \
              autonomous-data-engineer-agent-ci \
              id -u
          )"

          echo "Runtime UID: $runtime_uid"

          test "$runtime_uid" = "10001"


      # --------------------------------------------------------
      # CONTAINER CONFIGURATION
      # --------------------------------------------------------

      - name: Verify resolved DATA_ROOT
        run: |
          data_root="$(
            docker exec \
              autonomous-data-engineer-agent-ci \
              python -c \
              "from config.settings import get_runtime_settings; print(get_runtime_settings().data_root)"
          )"

          echo "DATA_ROOT: $data_root"

          test "$data_root" = "/app/runtime/data"


      # --------------------------------------------------------
      # DEBUGGING
      # --------------------------------------------------------

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs \
            autonomous-data-engineer-agent-ci \
            || true


      # --------------------------------------------------------
      # CLEANUP
      # --------------------------------------------------------

      - name: Remove test container
        if: always()
        run: |
          docker rm \
            --force \
            autonomous-data-engineer-agent-ci \
            || true