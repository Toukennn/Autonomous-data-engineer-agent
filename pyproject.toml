[project]
name = "data-engineer-agent"
version = "0.1.0"
description = "A safety-oriented agentic data engineering system for ETL workflows and natural-language SQL analytics."
readme = "README.md"
authors = [
    { name = "Toukennn", email = "amirrezakhatibi2009@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-postgres>=1.11.0",
    "langchain>=1.4.0",
    "langchain-anthropic>=1.7.2",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "requests>=2.32.0",
    "sqlglot>=30.18.0",
]

[dependency-groups]
dev = [
    "ipython>=9.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "config*",
    "models*",
    "utils*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
target-version = "py312"
line-length = 100


[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
